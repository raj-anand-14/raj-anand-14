plugins {
    id 'com.android.application'
}

android {
    namespace 'com.itachi.voice'
    compileSdk 34

    defaultConfig {
        applicationId 'com.itachi.voice'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Personal sideload over ADB: signed with the debug key, like the launcher.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
